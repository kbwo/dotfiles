# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  # But matches can also be dynamic:

  # Print the current date
  - trigger: ";ts;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%s"
  - trigger: ";n;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d %H:%M:%S"
  - trigger: ";ima"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%H:%M"
  - trigger: ";d;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"
  - trigger: ";w;"
    replace: "{{week}}"
    vars:
      - name: week
        type: date
        params:
          format: "%V"
  - trigger: ";yw;"
    replace: "{{yearweek}}"
    vars:
      - name: yearweek
        type: date
        params:
          format: "%Y-W%V"
  - trigger: ";h;"
    replace: "\n***\n"
  # Random 16-char alphanumeric string: concatenates 4 chunks picked by the
  # native "random" extension (no shell spawn, so it expands instantly).
  # 64 choices x 4 slots = ~16.7M combinations. Not for secrets/passwords.
  - trigger: ";r;"
    replace: "{{r1}}{{r2}}{{r3}}{{r4}}"
    vars:
      - name: r1
        type: random
        params:
          choices: &random_chunks
            - "h7pa"
            - "ImxK"
            - "5mrw"
            - "mbYM"
            - "6k3q"
            - "4g7Y"
