set-option -g prefix C-q

set -g extended-keys on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'brokenricefilms/tmux-fzf-session-switch'

set -g @jump-key 'f'

set -g @fzf-goto-session 'f'

set-option -g mouse on
#tmux-resurrect
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-processes 'irb pry "~rails server" "~rails console"'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-processes 'false'

set-option -g default-shell /bin/zsh
set-option -g default-command /bin/zsh
set-option -s escape-time 0

bind-key C-q send-prefix
unbind-key C-b
bind-key C-n switch-client -n
bind-key C-p switch-client -p
bind-key n switch-client -n
bind-key p switch-client -p
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -c "#{pane_current_path}"
bind-key c new-window -c "~" -a
# Change active window
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+
bind-key 9 select-window -t :$
# Resize pane
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Change active pane
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Break or kill pane
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key Q kill-session
bind-key d kill-window

bind-key w choose-window -Z -O creation
bind-key s choose-session -Z -O name

# Display pane
# bind-key i display-panes

# Key-bindings

# Reload config file
bind-key r source-file ~/.tmux.conf\; display-message "[tmux] ~/.tmux.conf reloaded!"
bind-key C-r source-file ~/.tmux.conf\; display-message "[tmux] ~/.tmux.conf reloaded!"

bind-key v copy-mode \; display "Copy mode!"
bind-key C-v copy-mode \; display "Copy mode!"
bind-key C-t copy-mode \; display "Copy mode!"

set-option -g history-limit 7500

bind-key -T edit-mode-vi Up send-keys -X history-up
bind-key -T edit-mode-vi Down send-keys -X history-down
unbind-key -T copy-mode-vi Space
bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"

# System window by supported OS
set-option -g set-titles on
set-option -g set-titles-string "[tmux] #T @ #H"

# Display time
set-option -g display-time 3500
## Window

# Start window index 1 origin
set-option -g base-index 1


# Start pane index 1 origin
set-window-option -g pane-base-index 1


# Appearance
# Palette (amber)
%hidden C_BG="#211c17"
%hidden C_SURFACE="#352d24"
%hidden C_FG="#efe5d6"
%hidden C_MUTED="#a29380"
%hidden C_ACCENT="#e6a04b"
%hidden C_ALERT="#e06c75"
%hidden C_LINE="#3d342a"

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

## Status bar
set -g status-position top
set -g status-justify left
set -g status-style "bg=$C_BG,fg=$C_MUTED"
# Session name turns to the alert colour while the prefix key is pressed
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=$C_ALERT],#[bg=$C_ACCENT]}#[fg=$C_BG,bold] #S #[default] "
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#[bg=$C_SURFACE,fg=$C_FG,bold] #I #W#{?window_zoomed_flag, [Z],} "
set -g status-right-length 60
set -g status-right "#[fg=$C_MUTED]#h  #[fg=$C_FG]%m/%d(%a) %H:%M "

## Pane borders
set -g pane-border-lines heavy
set -g pane-border-style "fg=$C_LINE"
set -g pane-active-border-style "fg=$C_ACCENT"

## Messages / modes / popups
set -g message-style "bg=$C_SURFACE,fg=$C_FG"
set -g message-command-style "bg=$C_SURFACE,fg=$C_ACCENT"
set -g mode-style "bg=$C_ACCENT,fg=$C_BG"
set -g copy-mode-match-style "bg=$C_SURFACE,fg=$C_FG"
set -g copy-mode-current-match-style "bg=$C_ALERT,fg=$C_BG"
set -g popup-border-lines rounded
set -g popup-border-style "fg=$C_ACCENT"
set -g menu-border-lines rounded
set -g menu-border-style "fg=$C_ACCENT"
set -g display-panes-colour "$C_MUTED"
set -g display-panes-active-colour "$C_ACCENT"
set -g clock-mode-colour "$C_ACCENT"

set-window-option -g mode-keys vi

set-option -g renumber-windows on

bind-key -r -T prefix Up run-shell 'tmux list-windows | head -n 1 | grep -q active || tmux swap-window -d -t -1'
bind-key -r -T prefix Down run-shell 'tmux list-windows | tail -n 1 | grep -q active || tmux swap-window -d -t +1'


set-option -g status-interval 2
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{==:#(cd "#{pane_current_path}" 2>/dev/null && [ -e .git ] && basename "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)" 2>/dev/null)" 2>/dev/null || basename "#{pane_current_path}"),},#{b:pane_current_path},#(cd "#{pane_current_path}" 2>/dev/null && [ -e .git ] && basename "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)" 2>/dev/null)" 2>/dev/null || basename "#{pane_current_path}")}'

# disable all notifications
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-option -g bell-action none

# Window visit history (C-o: older, C-i: newer, like vim jumplist)
set-hook -g after-select-window "run-shell -b 'if [ -x \"$HOME/.tmux/bin/winhistory\" ]; then \"$HOME/.tmux/bin/winhistory\" track #{q:session_name} \"#{window_index}\"; fi; true'"
bind-key C-o run-shell -b 'if [ -x "$HOME/.tmux/bin/winhistory" ]; then "$HOME/.tmux/bin/winhistory" prev #{q:session_name}; fi; true'
bind-key Tab run-shell -b 'if [ -x "$HOME/.tmux/bin/winhistory" ]; then "$HOME/.tmux/bin/winhistory" next #{q:session_name}; fi; true'

run '~/.tmux/plugins/tpm/tpm'

